[project]
name = "vicon-tui"
version = "0.1.0"
description = "TUI for manual robot control via Vicon"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.52.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
vicon-tui = "tui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tui"]
