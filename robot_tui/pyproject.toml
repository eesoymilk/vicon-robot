[project]
name = "robot-tui"
version = "0.1.0"
description = "Beautiful TUI for robot control via Vicon"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
robot-tui = "robot_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_tui"]
