[project]
name = "rlds-converter"
version = "0.1.0"
description = "Convert Vicon robot trajectories and camera images to RLDS format for VLA training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tensorflow-datasets>=4.9.0",
    "tensorflow>=2.15.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pandas>=2.2.0",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "typer>=0.9.0",
]

[project.scripts]
rlds-convert = "rlds_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlds_converter"]
