[project]
name = "robot-camera"
version = "0.1.0"
description = "RGB camera capture for VLA data collection and inference"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.0.0",
    "numpy>=1.24.0",
    "redis>=5.0.0",
]

[project.scripts]
robot-camera = "robot_camera.recorder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_camera"]
