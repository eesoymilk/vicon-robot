[project]
name = "robot-cli"
version = "0.1.0"
description = "CLI for manual robot control via Vicon"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
robot = "robot_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_cli"]
